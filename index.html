function wireObStep(){
  const catFixed = FIXED_CATALOG.map(f=>f.key);
  // goals (multi-select, com valor/saldo/prazo)
  document.querySelectorAll('[data-goal]').forEach(el=>el.onclick=(e)=>{
    if(e.target.closest('.ob-inline-fields')) return;
    const name=el.dataset.name, key=el.dataset.goal;
    const idx=ob.goals.findIndex(g=>g.name===name);
    if(idx>=0) ob.goals.splice(idx,1); else ob.goals.push({name, target:GOAL_TARGETS[key]||10000, saved:0, deadline:''});
    renderOb();
  });
  document.querySelectorAll('[data-goalcustom]').forEach(el=>el.onclick=(e)=>{
    if(e.target.closest('.ob-inline-fields')) return;
    const idx=ob.goals.findIndex(g=>g.name===el.dataset.goalcustom); if(idx>=0) ob.goals.splice(idx,1); renderOb();
  });
  document.querySelectorAll('.obGoalTarget').forEach(inp=>inp.oninput=()=>{ const g=ob.goals.find(x=>x.name===inp.dataset.name); if(g) g.target=parseFloat(inp.value)||0; });
  document.querySelectorAll('.obGoalSaved').forEach(inp=>inp.oninput=()=>{ const g=ob.goals.find(x=>x.name===inp.dataset.name); if(g) g.saved=parseFloat(inp.value)||0; });
  document.querySelectorAll('.obGoalDeadline').forEach(inp=>inp.oninput=()=>{ const g=ob.goals.find(x=>x.name===inp.dataset.name); if(g) g.deadline=inp.value; });
  const cg = document.getElementById('obCustomGoal'); if(cg) cg.oninput=()=>ob.customGoal=cg.value;
  const addGoal=document.getElementById('obAddGoal');
  if(addGoal){ const doAdd=()=>{ const el=document.getElementById('obCustomGoal'); const nm=el.value.trim(); if(!nm) return; if(!ob.goals.some(g=>g.name===nm)) ob.goals.push({name:nm, target:10000, saved:0, deadline:''}); ob.customGoal=''; renderOb(); };
    addGoal.onclick=doAdd; const gi=document.getElementById('obCustomGoal'); if(gi) gi.onkeydown=(e)=>{ if(e.key==='Enter'){e.preventDefault();doAdd();} }; }
  // banks
  document.querySelectorAll('[data-bank]').forEach(el=>el.onclick=(e)=>{
    if(e.target.closest('.ob-inline-fields')||e.target.closest('.tile-remove')) return;
    const k=el.dataset.bank;
    if(ob.banks[k]){ delete ob.banks[k]; }
    else { const m=BANKS.find(b=>b.key===k); ob.banks[k]={name:m?m.name:k,color:m?m.color:'#5B5B66',balance:''}; }
    renderOb();
  });
  document.querySelectorAll('[data-rmbank]').forEach(b=>b.onclick=(e)=>{ e.stopPropagation(); delete ob.banks[b.dataset.rmbank]; renderOb(); });
  document.querySelectorAll('.obBankBalance').forEach(inp=>inp.oninput=()=>{ ob.banks[inp.dataset.bank].balance=inp.value; });
  const addBank=document.getElementById('obAddBank');
  if(addBank){ const doAdd=()=>{ const el=document.getElementById('obNewBank'); const nm=el.value.trim(); if(!nm) return; ob.banks['cb_'+Date.now()]={name:nm,color:'#5B5B66',balance:''}; renderOb(); };
    addBank.onclick=doAdd; const nb=document.getElementById('obNewBank'); if(nb) nb.onkeydown=(e)=>{ if(e.key==='Enter'){e.preventDefault();doAdd();} }; }
  // cards
  document.querySelectorAll('[data-card]').forEach(el=>el.onclick=(e)=>{
    if(e.target.closest('.ob-inline-fields')||e.target.closest('.tile-remove')||e.target.closest('[data-cardimport]')||e.target.tagName==='INPUT') return;
    const k=el.dataset.card;
    if(ob.cards[k]){ delete ob.cards[k]; }
    else { const m=CARDS_CATALOG.find(c=>c.key===k); ob.cards[k]={name:m?m.name:k,color:m?m.color:'#5B5B66',invoice:'',due:'',importedItems:[]}; }
    renderOb();
  });
  document.querySelectorAll('[data-rmcard]').forEach(b=>b.onclick=(e)=>{ e.stopPropagation(); delete ob.cards[b.dataset.rmcard]; renderOb(); });
  document.querySelectorAll('.obCardInvoice').forEach(inp=>inp.oninput=()=>{ ob.cards[inp.dataset.card].invoice=inp.value; });
  document.querySelectorAll('.obCardDue').forEach(inp=>inp.oninput=()=>{ ob.cards[inp.dataset.card].due=inp.value; });
  document.querySelectorAll('[data-cardimport]').forEach(b=>b.onclick=(e)=>{ e.stopPropagation(); document.querySelector(`.obCardFile[data-card="${b.dataset.cardimport}"]`).click(); });
  document.querySelectorAll('.obCardFile').forEach(inp=>inp.onchange=(e)=>{
    const f=e.target.files[0]; if(!f) return; const k=inp.dataset.card;
    const r=new FileReader();
    r.onload=()=>{ let items=parseSpreadsheet(r.result); if(!items.length) items=SAMPLE_SHEET.slice(); ob.cards[k].importedItems=items; ob.cards[k].invoice=items.reduce((a,i)=>a+i.val,0).toFixed(2); renderOb(); };
    r.readAsText(f);
  });
  const addCard=document.getElementById('obAddCard');
  if(addCard){ const doAdd=()=>{ const el=document.getElementById('obNewCard'); const nm=el.value.trim(); if(!nm) return; ob.cards['cc_'+Date.now()]={name:nm,color:'#5B5B66',invoice:'',due:'',importedItems:[]}; renderOb(); };
    addCard.onclick=doAdd; const nc=document.getElementById('obNewCard'); if(nc) nc.onkeydown=(e)=>{ if(e.key==='Enter'){e.preventDefault();doAdd();} }; }
  // fixed
  document.querySelectorAll('[data-fixed]').forEach(el=>el.onclick=(e)=>{
    if(e.target.closest('.ob-inline-fields')||e.target.closest('.tile-remove')) return;
    const k=el.dataset.fixed;
    if(!catFixed.includes(k)) return; // customizados: só o X remove
    if(ob.fixed[k]){ delete ob.fixed[k]; }
    else { const m=FIXED_CATALOG.find(f=>f.key===k); ob.fixed[k]={name:m.name,icon:m.icon,color:m.color,val:'',due:''}; }
    renderOb();
  });
  document.querySelectorAll('[data-rmfixed]').forEach(b=>b.onclick=(e)=>{ e.stopPropagation(); delete ob.fixed[b.dataset.rmfixed]; renderOb(); });
  document.querySelectorAll('.obFixedVal').forEach(inp=>inp.oninput=()=>{ ob.fixed[inp.dataset.fixed].val=inp.value; });
  document.querySelectorAll('.obFixedDue').forEach(inp=>inp.oninput=()=>{ ob.fixed[inp.dataset.fixed].due=inp.value; });
  document.querySelectorAll('.obFixedMethod').forEach(sel=>sel.onchange=()=>{ ob.fixed[sel.dataset.fixed].method=sel.value; if(sel.value!=='Crédito') ob.fixed[sel.dataset.fixed].card=''; renderOb(); });
  document.querySelectorAll('.obFixedCard').forEach(sel=>sel.onchange=()=>{ ob.fixed[sel.dataset.fixed].card=sel.value; });
  const addFixed=document.getElementById('obAddFixed');
  if(addFixed){ const doAdd=()=>{ const el=document.getElementById('obNewFixed'); const nm=el.value.trim(); if(!nm) return; ob.fixed['cf_'+Date.now()]={name:nm,icon:'wallet',color:'purple',val:'',due:'',method:'Débito'}; renderOb(); };
    addFixed.onclick=doAdd; const nf=document.getElementById('obNewFixed'); if(nf) nf.onkeydown=(e)=>{ if(e.key==='Enter'){e.preventDefault();doAdd();} }; }
  // income list (step 5)
  document.querySelectorAll('.obIncName').forEach(inp=>inp.oninput=()=>{ ob.incomes[+inp.dataset.i].name=inp.value; });
  document.querySelectorAll('.obIncVal').forEach(inp=>inp.oninput=()=>{ ob.incomes[+inp.dataset.i].val=inp.value; });
  document.querySelectorAll('[data-rminc]').forEach(b=>b.onclick=()=>{ ob.incomes.splice(+b.dataset.rminc,1); renderOb(); });
  const addInc=document.getElementById('obAddIncome');
  if(addInc){ const doAdd=()=>{ const el=document.getElementById('obNewIncome'); const nm=el.value.trim(); ob.incomes.push({name:nm||'Nova fonte', val:'', icon:'wallet'}); renderOb(); };
    addInc.onclick=doAdd; const ni=document.getElementById('obNewIncome'); if(ni) ni.onkeydown=(e)=>{ if(e.key==='Enter'){e.preventDefault();doAdd();} }; }
  // text inputs
  const n=document.getElementById('obName'); if(n) n.oninput=()=>ob.name=n.value;
  const a=document.getElementById('obAge'); if(a) a.oninput=()=>ob.age=a.value;
  // nav
  document.getElementById('obNext').onclick=()=>{
    if(ob.step===1){
      if(!ob.name.trim()){ const el=document.getElementById('obName'); el.style.borderColor='var(--red)'; el.focus(); return; }
      // metas são opcionais; se digitou um objetivo e não adicionou, adiciona automaticamente
      if(ob.customGoal.trim() && !ob.goals.some(g=>g.name===ob.customGoal.trim())){ ob.goals.push({name:ob.customGoal.trim(), target:10000}); ob.customGoal=''; }
    }
    if(ob.step<5){ ob.step++; renderOb(); } else { ob.step='done'; renderOb(); }
  };
  document.getElementById('obBack').onclick=()=>{
    if(ob.step===1){
      if(ob.method==='import'){
        // devolve os lançamentos do cartão importado pra tela de importação
        if(ob.cards['importado'] && !ob.importedTx.length){ ob.importedTx = ob.cards['importado'].importedItems.slice(); delete ob.cards['importado']; }
        ob.fromImport=false; ob.step='import';
      } else { ob.step='method'; }
    }
    else ob.step--;
    renderOb();
  };
}

function obDone(){
  const bankCount = Object.keys(ob.banks).length;
  const cardCount = Object.keys(ob.cards).length;
  const fixedCount = Object.keys(ob.fixed).length;
  const fixedTotal = Object.values(ob.fixed).reduce((a,f)=>a+(parseFloat(f.val)||0),0);
  const incomeTotal = ob.incomes.reduce((a,i)=>a+(parseFloat(i.val)||0),0);
  const importedCount = ob.importedTx.length + Object.values(ob.cards).reduce((a,c)=>a+((c.importedItems||[]).length),0);
  return `<div class="ob-wrap">
    <div class="ob-done">
      <div class="check-circle">${ic('check')}</div>
      <h1 class="ob-h1" style="margin-bottom:0">Tudo pronto, ${(ob.name.trim()||'você').split(' ')[0]}!</h1>
      <p class="ob-sub" style="margin:0">Seu perfil vai alimentar automaticamente a Dashboard, os cartões, o calendário e as metas.</p>
      <div class="ob-summary">
        <div class="row"><span>Contas cadastradas</span><span>${bankCount}</span></div>
        <div class="row"><span>Cartões ativos</span><span>${cardCount}</span></div>
        ${importedCount?`<div class="row"><span>Lançamentos importados</span><span>${importedCount}</span></div>`:''}
        <div class="row"><span>Gastos fixos</span><span>${fixedCount} · ${BRL(fixedTotal)}/mês</span></div>
        <div class="row"><span>Renda mensal total</span><span>${BRL(incomeTotal)}</span></div>
      </div>
      <button class="btn primary" id="obFinish" style="width:100%;justify-content:center;padding:15px;font-size:15px;margin-top:8px">Concluir cadastro ${ic('check')}</button>
    </div>
  </div>`;
}
function wireObDone(){
  document.getElementById('obFinish').onclick = finishOnboarding;
}

function finishOnboarding(){
  // perfil + metas (múltiplas)
  state.profile.name = ob.name.trim() || state.profile.name;
  state.profile.age = ob.age;
  state.goals = ob.goals.map(g=>({name:g.name, target:g.target||10000, saved:g.saved||0, deadline:g.deadline||''}));
  state.profile.goal = state.goals[0]?.name || '';

  // contas
  state.obBanks = Object.entries(ob.banks).map(([key,v])=>({key, name:v.name, color:v.color, balance:parseFloat(v.balance)||0, custom:!BANKS.some(b=>b.key===key)}));
  state.accountsTotal = state.obBanks.length ? state.obBanks.reduce((a,b)=>a+b.balance,0) : undefined;

  // cartões
  const knownBg = {itau:'linear-gradient(135deg,#EC7000,#FF9A3D)', nubank:'linear-gradient(135deg,#7C2AE8,#A855F7)', inter:'linear-gradient(135deg,#FF7A00,#111111)', xp:'linear-gradient(135deg,#1A1A1A,#3A3A3A)'};
  const grad = c => `linear-gradient(135deg, ${c}, ${c}CC)`;
  state.obCards = Object.entries(ob.cards).map(([key,v])=>({key, name:v.name, color:v.color, invoice:parseFloat(v.invoice)||0, due:parseInt(v.due)||10, custom:!CARDS_CATALOG.some(c=>c.key===key), importedItems:v.importedItems||[]}));
  state.cards = state.obCards.map(c=>({ bank:c.name, kind:`Crédito · fatura dia ${c.due}`, bg:knownBg[c.key]||grad(c.color||'#5B5B66'), balance:c.invoice }));

  // gastos fixos (meio de pagamento + cartão de crédito vinculado)
  state.fixedOut = Object.entries(ob.fixed).map(([key,v])=>({name:v.name, val:parseFloat(v.val)||0, icon:v.icon, color:v.color, key, due:parseInt(v.due)||5, method:v.method||'Débito', card:v.card||'', custom:!FIXED_CATALOG.some(f=>f.key===key)}));
  // fixos pagos no crédito já contabilizam na fatura do cartão escolhido
  state.fixedOut.forEach(f=>{
    if(f.method==='Crédito' && f.card && f.val>0){
      const cardName = ob.cards[f.card]?.name;
      const c = state.cards.find(x=>x.bank===cardName);
      if(c) c.balance += f.val;
    }
  });

  // renda (fontes nomeadas)
  state.incomes = ob.incomes.map(i=>({name:i.name.trim()||'Fonte', val:parseFloat(i.val)||0, icon:i.icon||'wallet'})).filter(i=>i.val>0);

  // transações: começa vazio; entram os lançamentos importados, vinculados ao cartão
  const tx=[];
  ob.importedTx.forEach(i=> tx.push({t:i.desc, s:'Importado da planilha', v:-Math.abs(i.val), pos:false, icon:'cart', color:'red', cat:'Outros', method:'—', card:'', date:{day:TODAY.day, month:TODAY.month}}));
  state.obCards.forEach(c=> (c.importedItems||[]).forEach(i=> tx.push({t:i.desc, s:`Fatura ${c.name}`, v:-Math.abs(i.val), pos:false, icon:'cart', color:'red', cat:'Outros', method:'Crédito', card:c.name, date:{day:TODAY.day, month:TODAY.month}})));
  state.transactions = tx;

  // calendário: vencimentos de fixos + faturas de cartão
  const monthAbbr = TODAY.month;
  const fixedEvents = state.fixedOut.filter(f=>f.val>0).map(f=>({day:f.due||5, month:monthAbbr, title:`${f.name} — vencimento`, val:f.val, status:'pending'}));
  const cardEvents = state.cards.filter(c=>c.balance>0).map(c=>({day:parseInt((c.kind.match(/dia (\d+)/)||[])[1])||10, month:monthAbbr, title:/fatura/i.test(c.bank)?c.bank:`Fatura ${c.bank}`, val:c.balance, status:'pending'}));
  state.events = [...fixedEvents, ...cardEvents];

  state.onboardingDone = true;
  state.route = 'home';
  document.getElementById('ob').style.display='none';
  document.getElementById('app').style.display='block';
  boot();
}

/* ============================================================
   BOOT
   ============================================================ */
function boot(){
  if(!state.onboardingDone){
    startOnboarding(false);
    return;
  }
  document.getElementById('ob').style.display='none';
  document.getElementById('app').style.display='block';
  render(); // o render() (sobrescrito) já insere e conecta a barra inferior
}
function wireBottomNav(){
  document.querySelectorAll('.nav-btn').forEach(b=>b.onclick=()=>{state.route=b.dataset.route; renderAll();});
  document.getElementById('fabAdd').onclick = openQuickAddModal;
}

/* ============================================================
   PERSISTÊNCIA — salva tudo no navegador (mesmo aparelho)
   ============================================================ */
const SAVE_KEY = 'finapp_state_v1';
const PERSIST_KEYS = ['onboardingDone','profile','monthLabel','incomes','fixedOut','investments','cards','transactions','goals','groups','events','accountsTotal','obBanks','obCards','obIncome','settings','chat','selectedDay'];
function persist(){
  try{
    const o={}; PERSIST_KEYS.forEach(k=>{ if(state[k]!==undefined) o[k]=state[k]; });
    o.__theme = document.documentElement.getAttribute('data-theme')||'';
    localStorage.setItem(SAVE_KEY, JSON.stringify(o));
    if(window.CLOUD && window.CLOUD.enabled) window.CLOUD.save(o); // sincroniza na nuvem
  }catch(e){/* modo privado/sem espaço: segue sem salvar */}
}
function loadState(){
  try{
    const raw=localStorage.getItem(SAVE_KEY); if(!raw) return;
    const o=JSON.parse(raw);
    PERSIST_KEYS.forEach(k=>{ if(o[k]!==undefined) state[k]=o[k]; });
    if(o.__theme) document.documentElement.setAttribute('data-theme', o.__theme);
  }catch(e){}
}
function resetAllData(){
  try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
  location.reload();
}
function renderAll(){
  render();
  const oldNav = document.querySelector('.bottomnav'); if(oldNav) oldNav.remove();
  const oldFab = document.querySelector('.fab-add'); if(oldFab) oldFab.remove();
  document.getElementById('app').insertAdjacentHTML('afterend', bottomNav());
  wireBottomNav();
}
// replace simple render calls triggered inline with renderAll for full-page routes
const _origRender = render;
render = function(){ _origRender(); const nav=document.querySelector('.bottomnav'); if(nav){ nav.remove(); } const fab=document.querySelector('.fab-add'); if(fab) fab.remove(); document.getElementById('app').insertAdjacentHTML('afterend', bottomNav()); wireBottomNav(); persist(); };

if (window.FINAPP_CLOUD_ENABLED) {
  /* modo nuvem: cloud.js cuida de login → carregar dados → boot() */
} else {
  loadState();
  boot();
}
</script>
<script src="cloud.js"></script>
