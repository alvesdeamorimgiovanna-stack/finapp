<style>
/* ============ TOKENS ============ */
/* Pigeon palette — violet #834AFF · green #CFDE79 · pink #EA92C4 · orange #FD5526 · yellow #FABB01 */
:root{
  --bg:#ECECF1; --bg-soft:#F4F4F8; --card:#FFFFFF; --card-2:#F7F7FB;
  --ink:#111114; --ink-dim:#585863; --ink-faint:#9A9AA8;
  --line:rgba(17,17,20,0.07);
  --lime:#CFDE79; --lime-ink:#2A3606;        /* green (brand fill) */
  --green-ink:#5F7A0F;                         /* green for text/lines on light */
  --purple:#834AFF; --purple-soft:#EBE3FF;    /* violet */
  --amber:#FABB01; --amber-soft:#FFF3D2;       /* yellow */
  --red:#FD5526; --red-soft:#FFE4DA;           /* orange */
  --pink:#EA92C4; --pink-soft:#FBE8F3;
  --c-income:#5F7A0F; --c-expense:#FD5526; --c-balance:#834AFF;
  --shadow: 0 2px 6px rgba(17,17,20,0.04), 0 18px 40px -22px rgba(17,17,20,0.16);
  --radius-lg: 30px; --radius-md: 22px; --radius-sm: 16px;
  --font-display:'TT Norms Pro','Onest','Inter',system-ui,sans-serif;
  --font-body:'TT Norms Pro','Onest','Inter',system-ui,-apple-system,sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0B0B10; --bg-soft:#141419; --card:#17171E; --card-2:#1E1E26;
    --ink:#F4F4F7; --ink-dim:#AFAFBC; --ink-faint:#6B6B7A;
    --line:rgba(255,255,255,0.09);
    --lime:#CFDE79; --lime-ink:#20290A;
    --green-ink:#CFDE79;
    --purple:#9A6BFF; --purple-soft:rgba(131,74,255,0.18);
    --amber:#FABB01; --amber-soft:rgba(250,187,1,0.16);
    --red:#FD5526; --red-soft:rgba(253,85,38,0.18);
    --pink:#EA92C4; --pink-soft:rgba(234,146,196,0.16);
    --c-income:#CFDE79; --c-expense:#FF6A3D; --c-balance:#9A6BFF;
    --shadow: 0 2px 8px rgba(0,0,0,0.4), 0 20px 44px -22px rgba(0,0,0,0.7);
  }
}
:root[data-theme="dark"]{
  --bg:#0B0B10; --bg-soft:#141419; --card:#17171E; --card-2:#1E1E26;
  --ink:#F4F4F7; --ink-dim:#AFAFBC; --ink-faint:#6B6B7A;

  --red:#FD5526; --red-soft:rgba(253,85,38,0.18);
  --pink:#EA92C4; --pink-soft:rgba(234,146,196,0.16);
  --c-income:#CFDE79; --c-expense:#FF6A3D; --c-balance:#9A6BFF;
  --shadow: 0 2px 8px rgba(0,0,0,0.4), 0 20px 44px -22px rgba(0,0,0,0.7);
}
:root[data-theme="light"]{
  --bg:#ECECF1; --bg-soft:#F4F4F8; --card:#FFFFFF; --card-2:#F7F7FB;
  --ink:#111114; --ink-dim:#585863; --ink-faint:#9A9AA8;
  --line:rgba(17,17,20,0.07);
  --lime:#CFDE79; --lime-ink:#2A3606;
  --green-ink:#5F7A0F;
  --purple:#834AFF; --purple-soft:#EBE3FF;
  --amber:#FABB01; --amber-soft:#FFF3D2;
  --red:#FD5526; --red-soft:#FFE4DA;
  --pink:#EA92C4; --pink-soft:#FBE8F3;
  --c-income:#5F7A0F; --c-expense:#FD5526; --c-balance:#834AFF;

}

* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; padding:0; }
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--font-body), system-ui, sans-serif;
  font-optical-sizing:auto;
  transition:background .25s ease,color .25s ease;
  min-height:100vh;
}
h1,h2,h3,.display{ font-family:var(--font-display), system-ui, sans-serif; letter-spacing:-0.02em; text-wrap:balance; }
.num{ font-variant-numeric:tabular-nums; font-feature-settings:"tnum"; }
.mono{ font-family:var(--font-mono), monospace; }
::selection{ background:var(--purple); color:#fff; }
a{ color:inherit; }
button{ font-family:inherit; cursor:pointer; }
::-webkit-scrollbar{ width:0; height:0; }

/* ============ SHELL ============ */
#app{ max-width:1400px; margin:0 auto; padding:0 16px 100px; }
@media(min-width:900px){ #app{ padding:0 32px 40px; } }

.topbar{
  position:sticky; top:0; z-index:40; backdrop-filter:blur(16px);
  background:color-mix(in srgb, var(--bg) 82%, transparent);
  padding:14px 0 10px; border-bottom:1px solid transparent;
}
.shell-grid{ display:grid; grid-template-columns:1fr; gap:18px; padding-top:8px; }
@media(min-width:900px){
  .shell-grid{ grid-template-columns:240px 1fr 320px; gap:24px; align-items:start; }
  .shell-grid.no-aside{ grid-template-columns:240px 1fr; }
}

/* desktop sidebar */
.sidebar{ display:none; }
@media(min-width:900px){
  .sidebar{ display:flex; flex-direction:column; gap:6px; position:sticky; top:90px; }
  .sidebar .brand{ font-family:var(--font-display); font-weight:800; font-size:20px; padding:8px 14px 22px; }
  .sidebar .brand em{ color:var(--ink); font-style:normal; }
  .side-link{ display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:16px; color:var(--ink-dim); font-weight:600; font-size:14px; border:none; background:transparent; text-align:left; }
  .side-link svg{ width:19px; height:19px; flex:none; }
  .side-link.active{ background:var(--card); color:var(--ink); box-shadow:var(--shadow); }
  .side-link.active svg{ color:var(--purple); }
}
.mais-link{ display:flex; align-items:center; gap:12px; width:100%; padding:14px 12px; background:transparent; border:none; text-align:left; color:var(--ink); border-radius:14px; }
.mais-link:active{ background:var(--bg-soft); }
.mais-link svg{ width:20px; height:20px; flex:none; color:var(--ink-dim); }
.mais-link .ml-lead{ color:var(--purple); }
.mais-link .ml-lead svg{ color:var(--purple); }

header.hero{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
.hello{ display:flex; align-items:center; gap:12px; }
.avatar{
  width:46px; height:46px; border-radius:50%; flex:none;
  background:var(--ink);
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-weight:700; color:var(--bg); font-size:17px;
  box-shadow:var(--shadow);
}
.hello .greet{ font-size:12.5px; color:var(--ink-faint); font-weight:600; text-transform:uppercase; letter-spacing:.06em; }
.hello h1{ font-size:19px; margin:1px 0 0; font-weight:700; }
.top-actions{ display:flex; gap:8px; align-items:center; }
.icon-btn{
  width:40px; height:40px; border-radius:14px; border:1px solid var(--line);
  background:var(--card); display:flex; align-items:center; justify-content:center;
  color:var(--ink-dim);
}
.icon-btn svg{ width:18px; height:18px; }
.theme-toggle{ position:relative; width:56px; height:32px; border-radius:99px; border:1px solid var(--line); background:var(--card); padding:3px; }
.theme-toggle .knob{
  width:24px; height:24px; border-radius:50%; background:var(--ink);
  display:flex; align-items:center; justify-content:center; color:var(--bg);
  transition:transform .25s cubic-bezier(.4,0,.2,1); transform:translateX(0);
}
.theme-toggle.on .knob{ transform:translateX(24px); }
.theme-toggle svg{ width:13px; height:13px; }

/* ============ CARD PRIMITIVES ============ */
.card{ background:var(--card); border-radius:var(--radius-lg); box-shadow:var(--shadow); border:1px solid var(--line); }
.card-pad{ padding:20px; }
.section-title{ display:flex; align-items:baseline; justify-content:space-between; margin:26px 0 12px; }
.section-title h2{ font-size:16px; font-weight:700; margin:0; }
.section-title .link{ font-size:12.5px; color:var(--ink-faint); font-weight:600; background:none; border:none; }
.pill{ display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; padding:4px 10px; border-radius:99px; text-transform:uppercase; letter-spacing:.04em; }
.pill.ok{ background:var(--purple-soft); color:var(--purple); }
.pill.warn{ background:var(--amber-soft); color:var(--amber); }
.pill.bad{ background:var(--red-soft); color:var(--red); }
.pill.lime{ background:var(--purple-soft); color:var(--purple); }

/* ============ BALANCE BENTO ============ */
.bento{ display:grid; grid-template-columns:repeat(6,1fr); gap:14px; }
.balance-card{
  grid-column:span 6; border-radius:var(--radius-lg); padding:26px;
  background:linear-gradient(155deg,#17171C 0%, #23232B 100%);
  color:#F3F3F6; position:relative; overflow:hidden; box-shadow:var(--shadow);
}
.balance-card::after{
  content:''; position:absolute; right:-80px; top:-90px; width:250px; height:250px; border-radius:50%;

}
.balance-card .label{ font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:rgba(245,244,240,.55); font-weight:700; }
.balance-card .amount{ font-family:var(--font-display); font-size:40px; font-weight:800; margin:6px 0 18px; }
.balance-card .amount span{ font-size:20px; opacity:.5; }
.balance-row{ display:flex; gap:22px; flex-wrap:wrap; }
.balance-row .stat{ display:flex; align-items:center; gap:8px; }
.balance-row .dot{ width:9px; height:9px; border-radius:50%; }
.balance-row .stat-txt div:first-child{ font-size:11px; color:rgba(245,244,240,.5); font-weight:600; }
.balance-row .stat-txt div:last-child{ font-size:14.5px; font-weight:700; }

@media(min-width:640px){ .balance-card{ grid-column:span 4; } }
.mini-card{ grid-column:span 3; border-radius:var(--radius-md); padding:18px; display:flex; flex-direction:column; justify-content:space-between; gap:14px; min-height:120px; }
@media(min-width:640px){ .mini-card{ grid-column:span 2; } }
.mini-card .top{ display:flex; align-items:center; justify-content:space-between; }
.mini-card .ic{ width:34px; height:34px; border-radius:11px; display:flex; align-items:center; justify-content:center; }
.mini-card .ic svg{ width:16px; height:16px; }
.mini-card .val{ font-family:var(--font-display); font-size:21px; font-weight:800; }
.mini-card .lbl{ font-size:11.5px; color:var(--ink-faint); font-weight:600; }

/* ============ WALLET CARDS ============ */
.wallet-wrap{ position:relative; height:190px; }
@media(min-width:640px){ .wallet-wrap{ height:210px; } }
.wcard{
  position:absolute; inset:0; border-radius:22px; padding:20px; color:#fff;
  display:flex; flex-direction:column; justify-content:space-between;
  box-shadow:0 14px 30px -12px rgba(0,0,0,.35); transition:transform .35s cubic-bezier(.4,0,.2,1), box-shadow .35s;
  cursor:pointer;
}
.wcard .brand-row{ display:flex; justify-content:space-between; align-items:flex-start; }
.wcard .bank{ font-family:var(--font-display); font-weight:800; font-size:15px; letter-spacing:.02em; }
.wcard .kind{ font-size:10.5px; opacity:.75; text-transform:uppercase; letter-spacing:.08em; margin-top:2px; }
.wcard .chip{ width:32px; height:24px; border-radius:6px; background:linear-gradient(135deg,rgba(255,255,255,.85),rgba(255,255,255,.4)); }

.wcard .bottom{ display:flex; justify-content:space-between; align-items:flex-end; }
.wcard .amt{ font-family:var(--font-display); font-size:22px; font-weight:800; }
.wcard .amt-lbl{ font-size:10px; opacity:.7; text-transform:uppercase; letter-spacing:.06em; }

/* ============ TRANSACTIONS ============ */
.tx-row{ display:flex; align-items:center; gap:12px; padding:12px 4px; border-bottom:1px solid var(--line); }

.tx-mid{ flex:1; min-width:0; }

.tx-val.pos{ color:var(--lime-ink-alt,var(--lime)); }
:root[data-theme="light"] .tx-val.pos, :root:not([data-theme="dark"]) .tx-val.pos{ color:var(--green-ink); }
:root[data-theme="dark"] .tx-val.pos{ color:var(--lime); }
@media (prefers-color-scheme: dark){ .tx-val.pos{ color:var(--lime); } }
.tx-val.neg{ color:var(--ink); }

/* ============ GOAL ============ */
.goal-card{ padding:22px; }
.goal-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
.goal-top h3{ font-size:17px; margin:0 0 4px; font-weight:700; }
.goal-top .sub{ font-size:12.5px; color:var(--ink-faint); }

/* ============ QUICK READ ============ */

}

.parsed-preview.show{ display:flex; }
.parsed-preview svg{ width:20px; height:20px; color:var(--purple); flex:none; }

/* ============ GROUPS / SPLIT ============ */
.group-card{ padding:18px; display:flex; flex-direction:column; gap:12px; cursor:pointer; }
.group-top{ display:flex; align-items:center; gap:12px; }
.group-ic{ width:44px; height:44px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:800; color:#fff; }
.group-top h3{ font-size:15px; margin:0; font-weight:700; }

.group-members{ display:flex; }
.mchip{ width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:800; color:#fff; border:2px solid var(--card); margin-left:-8px; }

.settle-row{ display:flex; align-items:center; justify-content:space-between; font-size:13px; padding:9px 0; border-top:1px solid var(--line); }

.settle-row .amt.owed{ color:var(--lime-ink-alt,var(--lime)); }
:root[data-theme="light"] .settle-row .amt.owed, :root:not([data-theme="dark"]) .settle-row .amt.owed{ color:var(--green-ink); }
:root[data-theme="dark"] .settle-row .amt.owed{ color:var(--lime); }
@media(prefers-color-scheme:dark){ .settle-row .amt.owed{ color:var(--lime); } }

.form-row{ display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
.form-row label{ font-size:12px; font-weight:700; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.04em; }
.form-row input, .form-row select{
  border:1px solid var(--line); background:var(--bg-soft); color:var(--ink); border-radius:12px;
  padding:11px 13px; font-size:14px; font-family:inherit; outline:none;
}

.chip-select{ display:flex; flex-wrap:wrap; gap:8px; }

.chip-select .opt.sel{ background:var(--purple); color:#fff; border-color:var(--purple); }

/* ============ CALENDAR ============ */
.cal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
.cal-head .nav{ display:flex; gap:6px; }

/* ============ SETTINGS ============ */

.switch .k{ width:18px; height:18px; border-radius:50%; background:var(--ink-faint); position:absolute; top:3px; left:3px; transition:transform .2s, background .2s; }

.bottomnav{
  position:fixed; left:16px; right:16px; bottom:16px; z-index:50;

.view{ animation:rise .35s cubic-bezier(.4,0,.2,1); min-width:0; max-width:100%; }

.empty{ text-align:center; padding:30px 12px; color:var(--ink-faint); font-size:13px; }

// interpreta um valor digitado em formato brasileiro (R$ 1.500,50) -> número
function parseMoney(v){ if(typeof v==='number') return v; v=(v==null?'':v).toString().trim(); if(!v) return 0; v=v.replace(/[^\d.,-]/g,''); if(v.indexOf(',')>=0){ v=v.replace(/\./g,'').replace(',','.'); } const n=parseFloat(v); return isNaN(n)?0:n; }
// aplica máscara de moeda (digita centavos -> vira R$ 1.500,50) num <input>
function attachMoneyMask(input, initial){
  function fmt(d){ d=(d||'').replace(/\D/g,'').replace(/^0+/,''); if(!d) return ''; while(d.length<3) d='0'+d; const cents=d.slice(-2); const intp=d.slice(0,-2).replace(/\B(?=(\d{3})+(?!\d))/g,'.'); return 'R$ '+intp+','+cents; }
  if(initial!=null && initial!=='' && !isNaN(initial) && +initial>0){ input.value=fmt(String(Math.round(+initial*100))); }
  input.setAttribute('inputmode','numeric');
  input.addEventListener('input', ()=>{ input.value=fmt(input.value); });
}
const colorVar = c => ({purple:'var(--purple)',lime:'var(--lime)',amber:'var(--amber)',red:'var(--red)'}[c]||'var(--ink-dim)');

/* ============================================================
   DERIVED TOTALS (personal — excludes transitory group $)
   ============================================================ */
function totals(){
  const recurringIncome = (state.incomes||[]).reduce((a,b)=>a+(b.val||0),0);
  // entradas avulsas registradas neste mês (salário, freela, presente…)
  const entradasMes = (state.transactions||[]).filter(x=>x.pos && x.date && x.date.month===TODAY.month).reduce((a,x)=>a+x.v,0);
  const incomeTotal = recurringIncome + entradasMes;
  const fixedTotal = state.fixedOut.reduce((a,b)=>a+b.val,0);
  const varTotal = (state.transactions||[]).filter(x=>!x.pos).reduce((a,x)=>a+myPart(x),0); // só a sua parte (desconta divisão)
  const balance = incomeTotal - fixedTotal - varTotal;
  const investedTotal = (state.investments||[]).reduce((a,b)=>a+(b.amount||0),0);
  // saldo disponível baseado nas contas marcadas (só as que a pessoa escolhe)
  const banks = state.obBanks||[];
  const hasAccounts = banks.length>0;
  const dispTotal = banks.filter(b=>b.inDisp!==false).reduce((a,b)=>a+(b.balance||0),0);
  const dispNames = banks.filter(b=>b.inDisp!==false).map(b=>b.name);
  return {incomeTotal, recurringIncome, entradasMes, fixedTotal, varTotal, balance, investedTotal, hasAccounts, dispTotal, dispNames};
}

// mantém o total das contas em sincronia após editar/remover/descontar
function recalcAccounts(){
  const banks = state.obBanks||[];
  state.accountsTotal = banks.length ? banks.reduce((a,b)=>a+(b.balance||0),0) : undefined;
}

/* ============================================================
   GRUPOS / SPLIT
   ============================================================ */
function groupBalances(g){
  const paid = {}, owe = {};
  g.members.forEach(m=>{paid[m]=0; owe[m]=0;});
  g.expenses.forEach(e=>{
    paid[e.paidBy]+=e.total;
    const share = e.total/e.split.length;
    e.split.forEach(m=>owe[m]+=share);
  });
  const net = {};
  g.members.forEach(m=>net[m]=paid[m]-owe[m]);
  // quitações já feitas (from pagou to): quem pagou zera a dívida, quem recebeu deixa de ser credor
  (g.settlements||[]).forEach(s=>{ net[s.from]=(net[s.from]||0)+s.amt; net[s.to]=(net[s.to]||0)-s.amt; });
  return net;
}
// débitos onde alguém deve a "Eu"
function owedToMe(g){
  const tx = settleUp(groupBalances(g));
  return tx.filter(t=>t.to==='Eu');
}
function settleUp(net){
  const debtors = Object.entries(net).filter(([,v])=>v<-0.01).map(([k,v])=>[k,-v]);
  const creditors = Object.entries(net).filter(([,v])=>v>0.01).map(([k,v])=>[k,v]);
  const tx = [];
  let i=0,j=0;
  debtors.sort((a,b)=>b[1]-a[1]); creditors.sort((a,b)=>b[1]-a[1]);
  while(i<debtors.length && j<creditors.length){
    const amt = Math.min(debtors[i][1], creditors[j][1]);
    tx.push({from:debtors[i][0], to:creditors[j][0], amt});
    debtors[i][1]-=amt; creditors[j][1]-=amt;
    if(debtors[i][1]<0.01) i++;
    if(creditors[j][1]<0.01) j++;
  }
  return tx;
}

    ${(!spent.length && !bills.length && !income.length)?`<div class="empty">Nada registrado nem previsto para o dia ${sel}. Toque em outro dia ou adicione um lançamento.</div>`:''}
  </div>`;
}

/* ============================================================
   RELATÓRIO (dashboard visual curto / médio / longo prazo)
   ============================================================ */
function hbar(label, value, max, color, valColor){
  const pct = max>0 ? Math.max(3, value/max*100) : 0;
  return `<div class="hbar">
    <div class="hbar-top"><span>${label}</span><span class="num hbar-val">${BRL(value)}</span></div>
    <div class="hbar-track"><div class="hbar-fill" style="width:${pct}%;background:${color}" title="${label}: ${BRL(value)}"></div></div>
  </div>`;
}
function projectionSVG(start, monthlyNet, months){
  const pts=[]; let v=start;
  for(let i=0;i<=months;i++){ pts.push(v); v+=monthlyNet; }
  const max=Math.max(...pts,1), min=Math.min(...pts,0);
  const W=620,H=170,pad=10, bottom=H-22;
  const X=i=> pad + i/months*(W-2*pad);
  const Y=val=> pad + (1-(val-min)/((max-min)||1))*(bottom-pad);
  const line = pts.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(p).toFixed(1)}`).join(' ');
  const area = `${line} L ${X(months).toFixed(1)} ${bottom} L ${X(0).toFixed(1)} ${bottom} Z`;
  const grid=[0,.5,1].map(g=>{ const yy=pad+g*(bottom-pad); return `<line x1="${pad}" y1="${yy}" x2="${W-pad}" y2="${yy}" stroke="var(--line)" stroke-width="1"/>`; }).join('');
  const end=pts[pts.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet" style="display:block;height:auto;max-height:210px" role="img" aria-label="Projeção de saldo para ${months} meses, chegando a ${BRL(end)}">
    ${grid}
    <path class="area-anim" d="${area}" fill="var(--c-balance)" opacity="0.16"/>
    <path class="line-anim" pathLength="100" style="--len:100;stroke-dasharray:100;stroke-dashoffset:100" d="${line}" fill="none" stroke="var(--c-balance)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle class="dot-anim" cx="${X(months).toFixed(1)}" cy="${Y(end).toFixed(1)}" r="5" fill="var(--c-balance)" stroke="var(--card)" stroke-width="2"><title>Mês ${months}: ${BRL(end)}</title></circle>
    <text x="${pad}" y="${H-6}" font-size="11" fill="var(--ink-faint)">hoje</text>
    <text x="${W-pad}" y="${H-6}" font-size="11" fill="var(--ink-faint)" text-anchor="end">+${months} meses</text>
  </svg>`;
}

/* Rendimentos e despesas ao longo do ano */
function monthlySeries(){
  const t = totals();
  const recurring = t.recurringIncome, fixed = t.fixedTotal;
  const varByMonth = {}, inByMonth = {};
  (state.transactions||[]).forEach(x=>{ const mi = x.date? MONTHS_ABBR.indexOf(x.date.month) : TODAY.monthIdx;
    if(x.pos) inByMonth[mi]=(inByMonth[mi]||0)+x.v; else varByMonth[mi]=(varByMonth[mi]||0)+Math.abs(x.v); });
  const rend=[], gast=[], sald=[];
  for(let m=0;m<12;m++){ const r = recurring + (inByMonth[m]||0); const g = fixed + (varByMonth[m]||0); rend.push(r); gast.push(g); sald.push(r-g); }
  return {rend, gast, sald};
}
function annualChartSVG(){
  const {rend,gast,sald} = monthlySeries();
  const all=[...rend,...gast,...sald];
  const max=Math.max(...all,1), min=Math.min(...all,0);
  const W=680,H=250,padL=10,padR=10,padT=16,padB=30, n=12;
  const X=i=> padL + i/(n-1)*(W-padL-padR);
  const Y=v=> padT + (1-(v-min)/((max-min)||1))*(H-padT-padB);
  const path=arr=> arr.map((v,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join(' ');
  const area = `${path(sald)} L ${X(n-1).toFixed(1)} ${H-padB} L ${X(0).toFixed(1)} ${H-padB} Z`;
  const grid=[0,.25,.5,.75,1].map(g=>{ const yy=padT+g*(H-padT-padB); return `<line x1="${padL}" y1="${yy}" x2="${W-padR}" y2="${yy}" stroke="var(--line)" stroke-width="1"/>`; }).join('');
  const zeroY = Y(0);
  const zero = (min<0&&max>0)?`<line x1="${padL}" y1="${zeroY}" x2="${W-padR}" y2="${zeroY}" stroke="var(--ink-faint)" stroke-width="1" stroke-dasharray="3 3" opacity=".5"/>`:'';
  const months = MONTHS_ABBR.map((m,i)=>`<text x="${X(i).toFixed(1)}" y="${H-8}" font-size="10" fill="var(--ink-faint)" text-anchor="middle">${m[0]+m.slice(1).toLowerCase()}</text>`).join('');
  const lineEl=(arr,color,cls,delay,dash)=>`<path class="line-anim" pathLength="100" style="--len:100;stroke-dasharray:${dash||'100'};stroke-dashoffset:100;animation-delay:${delay}s" d="${path(arr)}" fill="none" stroke="${color}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>`;
  const dot=(arr,color,delay)=>`<circle class="dot-anim" style="animation-delay:${delay}s" cx="${X(n-1).toFixed(1)}" cy="${Y(arr[n-1]).toFixed(1)}" r="4.5" fill="${color}" stroke="var(--card)" stroke-width="2"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet" style="display:block;height:auto;max-height:280px" role="img" aria-label="Rendimentos, gastos e saldo ao longo dos 12 meses">
    ${grid}${zero}
    <path class="area-anim" d="${area}" fill="var(--c-balance)" opacity="0.12"/>
    ${lineEl(rend,'var(--c-income)','',0)}
    ${lineEl(gast,'var(--c-expense)','',.25,'4 3')}
    ${lineEl(sald,'var(--c-balance)','',.5)}
    ${dot(rend,'var(--c-income)',1.0)}${dot(gast,'var(--c-expense)',1.15)}${dot(sald,'var(--c-balance)',1.3)}
    ${months}
  </svg>`;
}

/* ============================================================
   ASSISTENTE "Fin" — motor de perguntas sobre os próprios dados
   (calcula direto no state; nada de números inventados)
   ============================================================ */
const norm = s => (s||'').toLowerCase().normalize('NFD').replace(/\p{Diacritic}/gu,'');
const CHAT_SYN = {
  'Transporte':['uber','99','taxi','corrida','transporte','gasolina','combustivel','onibus','metro'],
  'Alimentação':['ifood','lanche','comida','restaurante','almoco','jantar','padaria','cafe','delivery','alimentacao'],
  'Mercado':['mercado','supermercado','feira'],
  'Compras':['roupa','loja','shopping','tenis','sapato','compras'],
  'Lazer':['lazer','cinema','bar','festa','role','show','streaming','netflix','spotify'],
  'Saúde':['saude','farmacia','remedio','medico','academia','plano'],
  'Casa':['casa','aluguel','condominio','luz','agua','internet'],
  'Contas':['conta','boleto'],
  'Educação':['curso','ingles','faculdade','livro','educacao'],
};
function chatTimeFilter(q){
  if(/hoje/.test(q)) return {label:'hoje', test:d=> d && d.day===TODAY.day && d.month===TODAY.month};
  if(/ontem/.test(q)) return {label:'ontem', test:d=> d && d.day===TODAY.day-1 && d.month===TODAY.month};
  if(/semana/.test(q)) return {label:'nos últimos 7 dias', test:d=> d && d.month===TODAY.month && d.day>=TODAY.day-6 && d.day<=TODAY.day};
  if(/mes passado|mês passado/.test(q)) return {label:'no mês passado', test:d=> d && MONTHS_ABBR.indexOf(d.month)===TODAY.monthIdx-1};
  if(/mes|mês|esse mes/.test(q)) return {label:'neste mês', test:d=> d && d.month===TODAY.month};
  if(/ano/.test(q)) return {label:'neste ano', test:()=>true};
  return {label:'até agora', test:()=>true};
}
function chatDetectCat(q){
  for(const [cat,words] of Object.entries(CHAT_SYN)){
    const w = words.find(x=>q.includes(x));
    if(w) return {cat, term:w};
  }
  return null;
}
function chatDetectCard(q){
  const c = (state.cards||[]).find(c=>q.includes(norm(c.bank)));
  return c? c.bank : null;
}
function askFin(raw){
  const q = norm(raw);
  const t = totals();
  const sharesSum = x => txShares(x).reduce((s,sh)=>s+sh.amt,0);
  const cardName = chatDetectCard(q);
  const mentionsCredit = /credito|credit|cartao|cartoes|cartinh/.test(q);
  const tf = chatTimeFilter(q);
  const cd = chatDetectCat(q);

  // saudação / agradecimento
  if(/^(oi|ola|eae|opa|hey|bom dia|boa tarde|boa noite)\b/.test(q) && q.length<24)
    return {text:`Oi! 👋 Pode perguntar coisas como "quanto gastei com uber essa semana", "qual meu gasto real no cartão esse mês", "quem me deve" ou "qual meu saldo".`};
  if(/obrigad|valeu|vlw|brigad|thanks|obg/.test(q))
    return {text:'Por nada! 😊 Se precisar de mais alguma conta, é só chamar.'};
  // ajuda
  if(/ajuda|o que.*(pode|sabe|faz)|como funciona|exemplos?/.test(q))
    return {text:'Eu calculo em cima dos seus dados. Posso te dizer:', list:[
      ['Gastos','por categoria, período ou cartão'],
      ['Gasto real no cartão','sua parte, descontando o que te devem'],
      ['Quem te deve','a receber de cada pessoa'],
      ['Saldo','disponível nas suas contas'],
      ['Renda e investido','entradas do mês e patrimônio'],
      ['Metas','quanto falta pra cada uma'],
    ]};

  // quanto UMA PESSOA me deve (ex: "quanto o Eduardo me deve")
  const debtorNames=[...new Set([].concat(...(state.transactions||[]).map(x=>txShares(x).map(s=>s.name||'Alguém'))))].filter(Boolean);
  const personHit=debtorNames.find(n=>q.includes(norm(n)));
  if(personHit && /deve|dev|receber|pagou|pagar|falta|quitad/.test(q)){
    let unpaid=0,paid=0; const details=[];
    (state.transactions||[]).forEach(x=>txShares(x).forEach(s=>{
      if((s.name||'Alguém')!==personHit) return;
      const dia = x.date?` · ${String(x.date.day).padStart(2,'0')}/${MONTHS_ABBR.indexOf(x.date.month)+1}`:'';
      const onde = x.card?` · ${x.card}`:'';
      if(s.paid){ paid+=s.amt; }
      else { unpaid+=s.amt; details.push([`${x.t}${onde}${dia}`, BRL(s.amt)]); }
    }));
    if(unpaid<=0 && paid<=0) return {text:`${personHit} não tem nada registrado com você.`};
    if(unpaid<=0) return {text:`${personHit} está quitado ✅${paid>0?` — já te pagou ${BRL(paid)}`:''}.`};
    return {text:`${personHit} te deve ${BRL(unpaid)}${paid>0?` (já te pagou ${BRL(paid)})`:''}, somando todos os cartões:`, list:details};
  }
  // quem me deve / a receber (geral)
  if(/quem.*deve|me deve|me devem|a receber|falta receber|tenho pra receber|quem (ta|esta) devendo|quanto.*deve/.test(q)){
    const byP={};
    (state.transactions||[]).forEach(x=>{ txShares(x).forEach(s=>{ if(!s.paid){ byP[s.name||'Alguém']=(byP[s.name||'Alguém']||0)+s.amt; } }); });
    const entries=Object.entries(byP).filter(([,v])=>v>0.01).sort((a,b)=>b[1]-a[1]);
    if(!entries.length) return {text:'Ninguém está te devendo agora. Tudo quitado ✅'};
    const tot=entries.reduce((a,[,v])=>a+v,0);
    return {text:`Você tem ${BRL(tot)} a receber:`, list:entries.map(([n,v])=>[n, BRL(v)])};
  }
  // já recebido de divisões
  if(/ja recebi|quanto recebi|ja me pagaram|recebido dos|quitad/.test(q)){
    let rec=0; (state.transactions||[]).forEach(x=>{ txShares(x).forEach(s=>{ if(s.paid) rec+=s.amt; }); });
    return {text: rec>0 ? `Você já recebeu ${BRL(rec)} de divisões de compras.` : 'Você ainda não marcou nenhum recebimento de divisão.'};
  }

  // CARTÃO DE CRÉDITO: fatura / gasto / gasto real — usa a FATURA de cada cartão
  // (assim pega TODOS os cartões, inclusive os que têm fatura sem lançamentos avulsos)
  if((cardName || mentionsCredit) && !cd && /(gast|fatura|cartao|paguei|real|quanto|devo|dever)/.test(q)){
    if(!state.cards.length) return {text:'Você ainda não tem cartões cadastrados. Adicione na aba Cartões.'};
    const bd=(state.cards||[]).filter(c=>!cardName||c.bank===cardName).map(c=>{
      const owed=cardTx(c.bank).filter(x=>!x.date||x.date.month===TODAY.month).reduce((a,x)=>a+sharesSum(x),0);
      return {bank:c.bank, fatura:c.balance||0, owed, real:Math.max(0,(c.balance||0)-owed)};
    });
    const totFat=bd.reduce((a,c)=>a+c.fatura,0);
    const totOwed=bd.reduce((a,c)=>a+c.owed,0);
    const totReal=bd.reduce((a,c)=>a+c.real,0);
    if(/real|de verdade|minha parte|so o meu|meu mesmo/.test(q)){
      return {text:`Seu gasto real${cardName?` no ${cardName}`:' somando todos os cartões'} é ${BRL(totReal)}${totOwed>0?` — a fatura cheia é ${BRL(totFat)}, sendo ${BRL(totOwed)} de outras pessoas`:''}.`, list:bd.map(c=>[c.bank, BRL(c.real)])};
    }
    return {text:`${cardName?`A fatura do ${cardName} é`:'Suas faturas somam'} ${BRL(totFat)}${totOwed>0?` (seu gasto real: ${BRL(totReal)}; ${BRL(totOwed)} outras pessoas te devem)`:''}:`, list:bd.map(c=>[c.bank, BRL(c.fatura)])};
  }
  // GASTO REAL geral (fora de cartão) — desconta as divisões
  if(/gasto real|gastei de verdade|minha parte|realmente gastei|de verdade (foi|gastei)/.test(q)){
    let tx=(state.transactions||[]).filter(x=>!x.pos && tf.test(x.date));
    if(cd) tx=tx.filter(x=> x.cat===cd.cat || CHAT_SYN[cd.cat].some(w=>norm(x.t).includes(w)));
    const gross=tx.reduce((a,x)=>a+Math.abs(x.v),0);
    const others=tx.reduce((a,x)=>a+sharesSum(x),0);
    if(!tx.length) return {text:`Não achei gastos ${tf.label}. 🙂`};
    return {text:`Seu gasto real ${tf.label} foi ${BRL(Math.max(0,gross-others))}${others>0?` (do total de ${BRL(gross)}, ${BRL(others)} é de outras pessoas)`:''}.`};
  }

  // renda
  if(/quanto (ganho|ganhei|recebo|recebi)|minha renda|entrada de dinheiro|quanto entrou/.test(q)){
    const parts = (state.incomes||[]).map(i=>[i.name+' (fixa)', BRL(i.val)]);
    if(t.entradasMes>0) parts.push(['Entradas registradas no mês', BRL(t.entradasMes)]);
    if(!parts.length) return {text:'Você ainda não tem renda cadastrada. Cadastre em Ajustes → Fontes de renda, ou registre em "Adicionar rápido → Entrada".'};
    return {text:`Sua renda neste mês é ${BRL(t.incomeTotal)}:`, list:parts};
  }
  // investido
  if(/investi|investido|investimento|aplicado|patrimonio|rende|rendiment/.test(q)){
    if(!state.investments.length) return {text:'Você ainda não registrou investimentos. A aba Investimentos (menu "Mais") te ajuda com isso.'};
    return {text:`Você tem ${BRL(t.investedTotal)} investidos em ${state.investments.length} ativo(s):`, list:state.investments.map(i=>[`${i.name} (${i.type})`, BRL(i.amount)])};
  }
  // metas
  if(/meta|falta|objetivo|guardar|guardei|sonho/.test(q)){
    if(!state.goals.length) return {text:'Você ainda não tem metas. Dá pra criar na Home, em "Minhas metas".'};
    const g = state.goals.find(g=>q.includes(norm(g.name)) || norm(g.name).split(' ').some(w=>w.length>3&&q.includes(w)));
    const list = (g?[g]:state.goals);
    return {text: g?`Pra meta "${g.name}" faltam ${BRL(Math.max(0,g.target-g.saved))} de ${BRL(g.target)} (${Math.round(g.saved/g.target*100)}% concluído).` : 'Veja o andamento das suas metas:',
      list: g?null:list.map(x=>[x.name, `faltam ${BRL(Math.max(0,x.target-x.saved))}`])};
  }
  // saldo de uma conta específica ("quanto tenho na xp")
  const bankHit = (state.obBanks||[]).find(b=>q.includes(norm(b.name)));
  if(bankHit && /(saldo|tenho|conta|quanto)/.test(q) && !/gast|fatura/.test(q)){
    return {text:`Na conta ${bankHit.name} você tem ${BRL(bankHit.balance||0)}${bankHit.inDisp===false?' (não entra no saldo disponível)':''}.`};
  }
  // saldo disponível
  if(/saldo|quanto (tenho|sobra|me sobra|posso gastar)|quanto sobrou|dinheiro (tenho|disponivel)/.test(q)){
    if(t.hasAccounts){
      return {text:`Seu saldo disponível é ${BRL(t.dispTotal)}${t.dispNames.length?` (somando ${t.dispNames.join(', ')})`:''}.`,
        list:(state.obBanks||[]).filter(b=>b.inDisp!==false).map(b=>[b.name, BRL(b.balance||0)])};
    }
    return {text:`Seu saldo disponível ${state.monthLabel.split(' ')[0]} é ${BRL(t.balance)}.`, list:[['Entradas', BRL(t.incomeTotal)],['Gastos fixos', '−'+BRL(t.fixedTotal)],['Gastos variáveis', '−'+BRL(t.varTotal)]]};
  }
  // onde gasto mais
  if(/onde.*(gast|dinheiro)|maiores categorias|por categoria|em que.*gast|com o que.*gast/.test(q)){
    const cats = categorySpending();
    if(!cats.length) return {text:'Ainda não há gastos registrados pra analisar.'};
    return {text:'Suas maiores categorias de gasto são:', list:cats.slice(0,5).map(([n,v])=>[n, BRL(v)])};
  }
  // gastos (com categoria/tempo/cartão) — inclui "maior gasto"
  let tx = (state.transactions||[]).filter(x=>!x.pos && tf.test(x.date));
  if(cardName) tx = tx.filter(x=>x.card===cardName);
  else if(mentionsCredit) tx = tx.filter(x=>x.card||x.method==='Crédito');
  if(cd) tx = tx.filter(x=> x.cat===cd.cat || CHAT_SYN[cd.cat].some(w=>norm(x.t).includes(w)));
  const subjectLabel = cd ? (norm(cd.cat)===cd.term ? cd.cat.toLowerCase() : cd.term) : '';
  const subject = cd? ` com ${subjectLabel}` : '';
  const cardPhrase = cardName? ` no ${cardName}` : (mentionsCredit?' no cartão de crédito':'');
  if(/maior gasto|maior despesa|gastei mais|gasto mais caro/.test(q)){
    if(!tx.length) return {text:`Não achei gastos${subject}${cardPhrase} ${tf.label}.`};
    const big = tx.reduce((a,b)=>Math.abs(b.v)>Math.abs(a.v)?b:a);
    return {text:`Seu maior gasto${subject}${cardPhrase} ${tf.label} foi "${big.t}": ${BRL(Math.abs(big.v))}${big.date?` (dia ${big.date.day})`:''}.`};
  }
  if(/quanto|gast|despesa|paguei|gastei|comprei/.test(q) || cd || cardName || mentionsCredit){
    const total = tx.reduce((a,x)=>a+Math.abs(x.v),0);
    if(!tx.length) return {text:`Não encontrei gastos${subject}${cardPhrase} ${tf.label}. 🙂`};
    const top = tx.slice().sort((a,b)=>Math.abs(b.v)-Math.abs(a.v)).slice(0,4).map(x=>[x.t + (x.date?` · ${x.date.day}/${MONTHS_ABBR.indexOf(x.date.month)+1}`:''), BRL(Math.abs(x.v))]);
    const others = tx.reduce((a,x)=>a+sharesSum(x),0);
    const realNote = others>0 ? ` Desses, ${BRL(others)} outras pessoas te devem — seu gasto real foi ${BRL(total-others)}.` : '';
    return {text:`Você gastou ${BRL(total)}${subject}${cardPhrase} ${tf.label}, em ${tx.length} lançamento(s).${realNote}`, list:top};
  }
  // fallback
  return {text:'Não entendi 100% 🤔. Tenta assim: "quanto gastei com uber essa semana", "qual meu gasto real no cartão esse mês", "quem me deve" ou "qual meu saldo".'};
}

/* ============================================================
   CARTÕES (gestão interna de cada cartão)
   ============================================================ */
function cardTx(bank){ return (state.transactions||[]).filter(x=>x.card===bank && !x.pos); }
// divisão de uma transação: [{name, amt, paid}] — migra formato antigo (owed/owedBy)
function txShares(x){
  if(Array.isArray(x.shares)) return x.shares;
  if(x.owed>0){ x.shares=[{name:x.owedBy||'Alguém', amt:x.owed, paid:false}]; return x.shares; }
  return [];
}
// quanto já foi recebido de uma parte (suporta pagamento parcial; migra do 'paid' antigo)
function shareRecv(s){ return s.received!=null ? s.received : (s.paid ? s.amt : 0); }
// a SUA parte de um gasto = valor cheio menos o que os outros te devem (divisão)
function myPart(x){ return Math.max(0, Math.abs(x.v) - txShares(x).reduce((a,s)=>a+s.amt,0)); }
// garante um id em cada investimento (pra metas conseguirem apontar pra ele)
function ensureInvIds(){ (state.investments||[]).forEach(i=>{ if(!i.id) i.id='inv'+Date.now().toString(36)+Math.floor(Math.random()*1e5).toString(36); }); }
// quanto uma meta já tem guardado — pode vir de uma conta, de um investimento, ou manual
function goalSaved(g){
  if(g.linkType==='account'){ const a=(state.obBanks||[]).find(b=>b.key===g.linkId); return a?(a.balance||0):0; }
  if(g.linkType==='investment'){ const inv=(state.investments||[]).find(x=>x.id===g.linkId); return inv?(inv.amount||0):0; }
  return g.saved||0;
}
function goalLinkLabel(g){
  if(g.linkType==='account'){ const a=(state.obBanks||[]).find(b=>b.key===g.linkId); return a?('a conta '+a.name):'(conta removida)'; }
  if(g.linkType==='investment'){ const inv=(state.investments||[]).find(x=>x.id===g.linkId); return inv?('o investimento '+inv.name):'(investimento removido)'; }
  return '';
}

function wireThemeToggle(){
  const btn = document.getElementById('themeToggle');
  if(btn) btn.onclick = ()=>{
    const root = document.documentElement;
    const cur = root.getAttribute('data-theme');
    const sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const curDark = cur ? cur==='dark' : sysDark;
    root.setAttribute('data-theme', curDark ? 'light' : 'dark');
    render();
  };
}

function wireQuickAdd(box, inModal){
  if(!box) return;
  const single = (sel)=> box.querySelectorAll(sel+' .opt').forEach(o=>o.onclick=()=>{ box.querySelectorAll(sel+' .opt').forEach(x=>x.classList.remove('sel')); o.classList.add('sel'); });
  single('.qaCat'); single('.qaCard'); single('.qaSource'); single('.qaInAccount'); single('.qaAccount');
  // alternar Gasto / Entrada
  box.querySelectorAll('.qa-mode-btn').forEach(b=>b.onclick=()=>{
    const mode=b.dataset.mode;
    box.dataset.mode=mode;
    box.querySelectorAll('.qa-mode-btn').forEach(x=>x.classList.toggle('on', x.dataset.mode===mode));
    box.querySelectorAll('.qa-expense').forEach(el=>el.style.display = mode==='in'?'none':'');
    box.querySelectorAll('.qa-income').forEach(el=>el.style.display = mode==='in'?'':'none');
    const lbl=box.querySelector('.qaSaveLabel'); if(lbl) lbl.textContent = mode==='in'?'Adicionar entrada':'Adicionar gasto';
    const save=box.querySelector('.qaSave'); if(save) save.style.background = mode==='in'?'var(--green-ink)':'var(--ink)';
  });
  box.querySelectorAll('.qaMethod .opt').forEach(o=>o.onclick=()=>{
    box.querySelectorAll('.qaMethod .opt').forEach(x=>x.classList.remove('sel')); o.classList.add('sel');
    const isCredit = o.dataset.v==='Crédito';
    const cw = box.querySelector('.qaCardWrap'); if(cw) cw.style.display = isCredit? 'block':'none';
    const aw = box.querySelector('.qaAccountWrap'); if(aw) aw.style.display = isCredit? 'none':'block'; // débito/pix/etc: escolhe a conta
  });
  box.querySelector('.qaSave').onclick = ()=>{
    const mode = box.dataset.mode||'out';
    const valEl = box.querySelector('.qaVal');
    const val = parseFloat(valEl.value)||0;
    if(val<=0){ valEl.style.borderColor='var(--red)'; valEl.focus(); return; }
    const dateVal = box.querySelector('.qaDate').value || TODAY_ISO;
    const [ , M, D] = dateVal.split('-').map(Number);
    const date = {day:D, month:MONTHS_ABBR[(M-1)]||TODAY.month};
    const desc = box.querySelector('.qaDesc').value.trim();
    if(mode==='in'){
      const source = box.querySelector('.qaSource .opt.sel')?.dataset.v || '';
      const label = desc || source || 'Entrada';
      const acctKey = box.querySelector('.qaInAccount .opt.sel')?.dataset.v || '';
      if(acctKey){ const acc=(state.obBanks||[]).find(b=>b.key===acctKey); if(acc){ acc.balance=(acc.balance||0)+val; recalcAccounts(); } }
      state.transactions.unshift({ t:label, s:`Entrada${source?' · '+source:''}`, v:val, pos:true, icon:'up', color:'lime', cat:'Entrada', method:'—', card:'', account:acctKey, date });
    } else {
      const cat = box.querySelector('.qaCat .opt.sel')?.dataset.v || 'Outros';
      const method = box.querySelector('.qaMethod .opt.sel')?.dataset.v || 'Débito';
      const meta = catMeta(cat);
      let cardName='', acctKey='';
      if(method==='Crédito' && state.cards.length){
        const ci = parseInt(box.querySelector('.qaCard .opt.sel')?.dataset.v);
        if(!isNaN(ci) && state.cards[ci]){ state.cards[ci].balance += val; cardName = state.cards[ci].bank; }
      } else {
        acctKey = box.querySelector('.qaAccount .opt.sel')?.dataset.v || '';
        if(acctKey){ const acc=(state.obBanks||[]).find(b=>b.key===acctKey); if(acc){ acc.balance=(acc.balance||0)-val; recalcAccounts(); } } // desconta da conta escolhida
      }
      const acctName = acctKey ? ((state.obBanks||[]).find(b=>b.key===acctKey)?.name||'') : '';
      state.transactions.unshift({ t: desc || cat, s: `${cat} · ${method}${cardName?' · '+cardName:(acctName?' · '+acctName:'')}`, v:-val, pos:false, icon:meta.icon, color:meta.color, cat, method, card:cardName, account:acctKey, date });
    }
    if(date.month===TODAY.month) state.selectedDay = date.day;
    if(inModal) closeModal();
    render();
  };
}

function wireRouteExtras(){
  // quick add form(s)
  document.querySelectorAll('.quickadd').forEach(box=>wireQuickAdd(box, false));

  // metas
  const addGoalBtn = document.getElementById('addGoalBtn');
  if(addGoalBtn) addGoalBtn.onclick = openAddGoalModal;
  document.querySelectorAll('.goalAport').forEach(b=>b.onclick=()=>openAportModal(+b.dataset.i));
  document.querySelectorAll('.goalEdit').forEach(b=>b.onclick=(e)=>{ e.stopPropagation(); openAddGoalModal(+b.dataset.i); });
  document.querySelectorAll('.goalDel').forEach(b=>b.onclick=(e)=>{ e.stopPropagation(); state.goals.splice(+b.dataset.i,1); render(); });

  // rendas
  const addIncomeBtn = document.getElementById('addIncomeBtn');
  if(addIncomeBtn) addIncomeBtn.onclick = ()=>openAddIncomeModal();
  document.querySelectorAll('.incEdit').forEach(b=>b.onclick=()=>openAddIncomeModal(+b.dataset.i));
  document.querySelectorAll('.incDel').forEach(b=>b.onclick=()=>{ state.incomes.splice(+b.dataset.i,1); render(); });

  // calendário — seleção de dia + navegação de mês
  const calGrid = document.getElementById('calGrid');
  if(calGrid) calGrid.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{ state.selectedDay=+b.dataset.day; render(); });
  const calPrev = document.getElementById('calPrev');
  if(calPrev) calPrev.onclick=()=>{ state.calMonth--; if(state.calMonth<0){state.calMonth=11; state.calYear--;} render(); };
  const calNext = document.getElementById('calNext');
  if(calNext) calNext.onclick=()=>{ state.calMonth++; if(state.calMonth>11){state.calMonth=0; state.calYear++;} render(); };
  const calToday = document.getElementById('calToday');
  if(calToday) calToday.onclick=()=>{ state.calMonth=TODAY.monthIdx; state.calYear=2026; state.selectedDay=TODAY.day; render(); };

  // cartões
  document.querySelectorAll('[data-cardidx]').forEach(b=>b.onclick=()=>{ state.activeCard=+b.dataset.cardidx; render(); });
  const addCardBtn=document.getElementById('addCardBtn'); if(addCardBtn) addCardBtn.onclick=openAddCardModal;
  const cardAdjust=document.getElementById('cardAdjustBtn'); if(cardAdjust) cardAdjust.onclick=()=>openAdjustFaturaModal(state.activeCard||0);
  const cardAddTx=document.getElementById('cardAddTxBtn'); if(cardAddTx) cardAddTx.onclick=()=>openCardTxModal(state.activeCard||0);
  const cmPrev=document.getElementById('cardMonthPrev'); if(cmPrev) cmPrev.onclick=()=>{ if(state.cardMonth==null) state.cardMonth=TODAY.monthIdx; state.cardMonth=((state.cardMonth-1)%12+12)%12; render(); };
  const cmNext=document.getElementById('cardMonthNext'); if(cmNext) cmNext.onclick=()=>{ if(state.cardMonth==null) state.cardMonth=TODAY.monthIdx; state.cardMonth=(state.cardMonth+1)%12; render(); };
  const showAllBtn=document.getElementById('cardShowAllBtn'); if(showAllBtn) showAllBtn.onclick=()=>{ state.cardShowAll=!state.cardShowAll; render(); };
  document.querySelectorAll('.cardTxEdit').forEach(b=>b.onclick=()=>openEditCardTxModal(+b.dataset.i));
  document.querySelectorAll('.cardTxDel').forEach(b=>b.onclick=()=>{
    const bank=b.dataset.bank, t=decodeURIComponent(b.dataset.t), v=parseFloat(b.dataset.v);
    const idx=state.transactions.findIndex(x=>x.card===bank && x.t===t && x.v===v);
    if(idx>=0){ const removed=state.transactions[idx]; state.transactions.splice(idx,1); const c=state.cards.find(x=>x.bank===bank); if(c && removed.date && MONTHS_ABBR.indexOf(removed.date.month)===TODAY.monthIdx) c.balance=Math.max(0,c.balance-Math.abs(v)); }
    render();
  });
  // cartão: dar baixa em quem pagou a parte dele
  document.querySelectorAll('.cardReceiveBtn').forEach(b=>b.onclick=()=>openReceiveModal(b.dataset.bank, decodeURIComponent(b.dataset.name)));
  // excluir qualquer transação (com confirmação e revertendo efeitos)
  document.querySelectorAll('.txDel').forEach(b=>b.onclick=()=>{
    const x=state.transactions[+b.dataset.i]; if(!x) return;
    openModal(`<div class="modal-head"><h3>Excluir transação?</h3><button class="modal-close" id="modalCloseBtn">${ic('x')}</button></div>
      <p style="font-size:13.5px;color:var(--ink-dim);margin:0 0 16px">Remover <strong>${x.t}</strong> (${BRL(Math.abs(x.v))})?${x.card?` Isso também abate da fatura do ${x.card}.`:''}${x.account?(x.pos?' O valor sai do saldo da conta.':' O valor volta pro saldo da conta.'):''}</p>
      <div style="display:flex;gap:8px"><button class="btn ghost" style="flex:1" id="txDelCancel">Cancelar</button><button class="btn primary" style="flex:1;background:var(--red);color:#fff" id="txDelOk">Excluir</button></div>`);
    document.getElementById('txDelCancel').onclick=closeModal;
    document.getElementById('txDelOk').onclick=()=>{
      if(x.card && !x.pos){ const c=state.cards.find(cc=>cc.bank===x.card); if(c && x.date && MONTHS_ABBR.indexOf(x.date.month)===TODAY.monthIdx) c.balance=Math.max(0,c.balance-Math.abs(x.v)); }
      if(x.account){ const a=(state.obBanks||[]).find(bk=>bk.key===x.account); if(a){ a.balance=(a.balance||0)-x.v; recalcAccounts(); } } // entrada devolve, gasto no débito re-credita
      const idx=state.transactions.indexOf(x); if(idx>=0) state.transactions.splice(idx,1);
      closeModal(); render();
    };
  });

  // assistente Fin
  const chatInput=document.getElementById('chatInput');
  const chatSend=document.getElementById('chatSend');
  if(chatSend&&chatInput){
    chatSend.onclick=()=>{ const v=chatInput.value; chatAsk(v); };
    chatInput.onkeydown=(e)=>{ if(e.key==='Enter'){ e.preventDefault(); chatAsk(chatInput.value); } };
  }
  document.querySelectorAll('.chat-chip').forEach(c=>c.onclick=()=>chatAsk(c.dataset.q));
  const sc=document.getElementById('chatScroll'); if(sc) sc.scrollTop=sc.scrollHeight;

  // group / expense creation
  const newGroupBtn = document.getElementById('newGroupBtn');
  if(newGroupBtn) newGroupBtn.onclick = openNewGroupModal;
  const addExpenseBtn = document.getElementById('addExpenseBtn');
  if(addExpenseBtn) addExpenseBtn.onclick = ()=>openAddExpenseModal(state.activeGroup);
  // dar baixa em quem pagou / paguei — abre modal p/ escolher conta ou "não somar"
  document.querySelectorAll('.settleBtn').forEach(b=>b.onclick=()=>{
    openSettleModal(b.dataset.from, b.dataset.to||'Eu', parseFloat(b.dataset.amt));
  });
  // definir/editar prazo de acerto
  const editDue = document.getElementById('editGroupDue');
  if(editDue) editDue.onclick = ()=>openGroupDueModal(state.activeGroup);
  // excluir grupo
  const delG = document.getElementById('delGroupBtn');
  if(delG) delG.onclick = ()=>{
    const g = state.groups.find(x=>x.id===state.activeGroup); if(!g) return;
    openModal(`<div class="modal-head"><h3>Excluir grupo?</h3><button class="modal-close" id="modalCloseBtn">${ic('x')}</button></div>
      <p style="font-size:13.5px;color:var(--ink-dim);margin:0 0 16px">Isso remove o grupo <strong>${g.name}</strong> e todas as despesas dele. Não afeta seu saldo pessoal. Não dá pra desfazer.</p>
      <div style="display:flex;gap:8px"><button class="btn ghost" style="flex:1" id="delGCancel">Cancelar</button><button class="btn primary" style="flex:1;background:var(--red);color:#fff" id="delGConfirm">Excluir grupo</button></div>`);
    document.getElementById('delGCancel').onclick=closeModal;
    document.getElementById('delGConfirm').onclick=()=>{ state.groups=state.groups.filter(x=>x.id!==g.id); closeModal(); state.route='grupos'; render(); };
  };

  // wallet cycle
  const wrap = document.getElementById('walletWrap');
  if(wrap) wrap.onclick = (e)=>{
    const card = e.target.closest('.wcard'); if(!card) return;
    state.cards.push(state.cards.shift());
    render();
  };

  // settings switches
  document.querySelectorAll('.switch').forEach(sw=>sw.onclick=()=>{
    const k = sw.dataset.k; if(!k) return; state.settings[k]=!state.settings[k]; render();
  });

  // contas: toggle disponível, editar, remover, adicionar
  document.querySelectorAll('.acctDisp').forEach(b=>b.onclick=()=>{ const bk=state.obBanks[+b.dataset.i]; bk.inDisp = !(bk.inDisp!==false); render(); });
  document.querySelectorAll('.acctEdit').forEach(b=>b.onclick=()=>openAccountModal(+b.dataset.i));
  document.querySelectorAll('.acctDel').forEach(b=>b.onclick=()=>{ state.obBanks.splice(+b.dataset.i,1); recalcAccounts(); render(); });
  const addAcct=document.getElementById('addAccountBtn'); if(addAcct) addAcct.onclick=()=>openAccountModal();

  // fab
  const fab = document.getElementById('fabAdd');
  if(fab) fab.onclick = openQuickAddModal;

  // detalhes dos cards da home
  const balD=document.getElementById('balDetail'); if(balD && (state.obBanks||[]).length) balD.onclick=openBalanceDetail;
  const varD=document.getElementById('varDetail'); if(varD) varD.onclick=openVarDetail;
  const fixoD=document.getElementById('fixoDetail'); if(fixoD) fixoD.onclick=openFixoDetail;

  // redo onboarding
  const redo = document.getElementById('redoOnboardingBtn');
  if(redo) redo.onclick = ()=>{ startOnboarding(true); };
  const redo2 = document.getElementById('redoOnboardingBtn2');
  if(redo2) redo2.onclick = ()=>{ startOnboarding(true); };
  const resetBtn = document.getElementById('resetDataBtn');
  if(resetBtn) resetBtn.onclick = ()=>{
    openModal(`<div class="modal-head"><h3>Apagar tudo?</h3><button class="modal-close" id="modalCloseBtn">${ic('x')}</button></div>
      <p style="font-size:13.5px;color:var(--ink-dim);margin:0 0 16px">Isso remove todos os seus dados salvos neste aparelho (cartões, gastos, metas, chat) e volta pro início. Não dá pra desfazer.</p>
      <div style="display:flex;gap:8px"><button class="btn ghost" style="flex:1" id="resetCancel">Cancelar</button><button class="btn primary" style="flex:1;background:var(--red);color:#fff" id="resetConfirm">Apagar tudo</button></div>`);
    document.getElementById('resetCancel').onclick=closeModal;
    document.getElementById('resetConfirm').onclick=resetAllData;
  };

  // report horizon toggle
  const ht = document.getElementById('horizonToggle');
  if(ht) ht.querySelectorAll('button').forEach(b=>b.onclick=()=>{ state.reportHorizon=b.dataset.h; render(); });

  // add investment
  const addInv = document.getElementById('addInvBtn');
  if(addInv) addInv.onclick = openAddInvestmentModal;
}

function openAddInvestmentModal(){
  openModal(`
    <div class="modal-head"><h3>Novo aporte</h3><button class="modal-close" id="modalCloseBtn">${ic('x')}</button></div>
    <div class="form-row"><label>Nome do ativo</label><input id="iName" placeholder="Ex: Tesouro Selic 2029"></div>
    <div class="form-row"><label>Instituição</label><input id="iInst" placeholder="Ex: XP, Nubank, Rico"></div>
    <div class="form-row"><label>Tipo</label><div class="chip-select" id="iType">
      ${['Renda Fixa','Fundos','Ações','Cripto'].map((x,idx)=>`<span class="opt ${idx===0?'sel':''}" data-v="${x}">${x}</span>`).join('')}
    </div></div>
    <div class="form-row"><label>Valor aplicado (R$)</label><input id="iAmount" type="number" step="0.01" placeholder="0,00"></div>
    <div class="form-row"><label>De qual conta saiu?</label><div class="chip-select" id="iFrom">
      ${(state.obBanks||[]).length ? (state.obBanks||[]).map((b,idx)=>`<span class="opt ${idx===0?'sel':''}" data-k="${b.key}">${b.name}</span>`).join('') + `<span class="opt" data-k="">Não descontar</span>` : '<span style="font-size:12px;color:var(--ink-faint)">Cadastre uma conta em Ajustes → Minhas contas para descontar automaticamente.</span>'}
    </div></div>
    <div class="form-row"><label>Rentabilidade estimada (% a.a.)</label><input id="iRet" type="number" step="0.1" placeholder="Ex: 11.2"></div>
    <button class="btn primary" style="width:100%" id="iSave">Adicionar ativo</button>
  `);
  let type='Renda Fixa';
  document.querySelectorAll('#iType .opt').forEach(o=>o.onclick=()=>{ document.querySelectorAll('#iType .opt').forEach(x=>x.classList.remove('sel')); o.classList.add('sel'); type=o.dataset.v; });
  let fromKey=(state.obBanks&&state.obBanks[0])?state.obBanks[0].key:'';
  document.querySelectorAll('#iFrom .opt').forEach(o=>o.onclick=()=>{ document.querySelectorAll('#iFrom .opt').forEach(x=>x.classList.remove('sel')); o.classList.add('sel'); fromKey=o.dataset.k; });
  document.getElementById('iSave').onclick=()=>{
    const name=document.getElementById('iName').value.trim()||'Novo ativo';
    const inst=document.getElementById('iInst').value.trim()||'—';
    const amount=parseFloat(document.getElementById('iAmount').value)||0;
    const ret=parseFloat(document.getElementById('iRet').value)||0;
    if(amount<=0) return;
    if(!state.investments) state.investments=[];
    if(fromKey){ const acc=(state.obBanks||[]).find(b=>b.key===fromKey); if(acc){ acc.balance=(acc.balance||0)-amount; recalcAccounts(); } }
    state.investments.unshift({id:'inv'+Date.now().toString(36)+Math.floor(Math.random()*1e5).toString(36), name, inst, type, amount, ret, fromKey});
    closeModal(); render();
  };
}

    </div>

      </div>

  `);

  const chk=document.getElementById('ctShared'), sb=document.getElementById('ctShareBox');
  function renderCtRows(){
    const n=Math.max(2, parseInt(document.getElementById('ctPeople').value)||2);
    const tot=parseFloat(document.getElementById('ctVal').value)||0;
    const each=tot? tot/n : 0;
    const cont=document.getElementById('ctPeopleRows');

    for(let i=0;i<n-1;i++){
      html+=`<div class="ctRow" style="display:flex;gap:8px;margin-bottom:8px">
        <input class="ctName" placeholder="Pessoa ${i+1}" value="${names[i]||''}" style="flex:1">
        <input class="ctAmt" type="number" step="0.01" placeholder="0,00" value="${each?each.toFixed(2):''}" style="width:108px">
      </div>`;
    }
    cont.innerHTML=html;
  }
  chk.onchange=()=>{ sb.style.display=chk.checked?'block':'none'; if(chk.checked) renderCtRows(); };
  document.getElementById('ctPeople').oninput=renderCtRows;
  document.getElementById('ctVal').addEventListener('input', ()=>{ if(chk.checked) renderCtRows(); updateInstallInfo(); });
  // parcelamento
  const inst=document.getElementById('ctInstall'), ib=document.getElementById('ctInstallBox');
  let startOff=1;
  document.querySelectorAll('#ctStart .opt').forEach(o=>o.onclick=()=>{ document.querySelectorAll('#ctStart .opt').forEach(x=>x.classList.remove('sel')); o.classList.add('sel'); startOff=parseInt(o.dataset.v)||0; updateInstallInfo(); });
  function updateInstallInfo(){
    const info=document.getElementById('ctInstallInfo'); if(!info) return;
    if(!inst.checked){ info.textContent=''; return; }
    const N=Math.max(2, parseInt(document.getElementById('ctParcelas').value)||2);
    const val=parseFloat(document.getElementById('ctVal').value)||0;
    const per=val? val/N : 0;
    const m1=MONTHS_ABBR[(TODAY.monthIdx+startOff)%12];
    const mN=MONTHS_ABBR[(TODAY.monthIdx+startOff+N-1)%12];
    info.textContent = val? `${N}x de ${BRL(per)} — de ${m1} a ${mN}.` : `${N}x — começa em ${m1}.`;
  }
  inst.onchange=()=>{ ib.style.display=inst.checked?'block':'none'; updateInstallInfo(); };
  document.getElementById('ctParcelas').oninput=updateInstallInfo;
  document.getElementById('ctSave').onclick=()=>{
    const val=parseFloat(document.getElementById('ctVal').value)||0; if(val<=0){ document.getElementById('ctVal').style.borderColor='var(--red)'; return; }
    const desc=document.getElementById('ctDesc').value.trim()||cat;
    const dv=document.getElementById('ctDate').value||TODAY_ISO; const [,M,D]=dv.split('-').map(Number);
    const meta=catMeta(cat);
    let shares=[];
    if(chk.checked){
      document.querySelectorAll('#ctPeopleRows .ctRow').forEach((r,i)=>{
        const nm=r.querySelector('.ctName').value.trim()||('Pessoa '+(i+1));
        const am=parseFloat(r.querySelector('.ctAmt').value)||0;
        if(am>0) shares.push({name:nm, amt:Math.min(am,val), paid:false});
      });
    }
    const owedSum=shares.reduce((a,s)=>a+s.amt,0);
    if(!inst.checked){
      // à vista: entra na fatura na data escolhida
      const date={day:D, month:MONTHS_ABBR[(M-1)]||TODAY.month};
      c.balance += val;
      state.transactions.unshift({ t:desc, s:`${cat} · Crédito · ${c.bank}`, v:-val, pos:false, icon:meta.icon, color:meta.color, cat, method:'Crédito', card:c.bank, shares, owed:owedSum, owedBy:(shares[0]?shares[0].name:''), date });
      if(date.month===TODAY.month) state.selectedDay=date.day;
    } else {
      // parcelado: 1 lançamento por mês, começando em "startOff"
      const N=Math.max(2, parseInt(document.getElementById('ctParcelas').value)||2);
      const group='p'+Date.now();
      const base=Math.floor(val/N*100)/100;
      const sBase=shares.map(s=>Math.floor(s.amt/N*100)/100);
      for(let k=0;k<N;k++){
        const isLast=k===N-1;
        const pval=isLast? +(val-base*(N-1)).toFixed(2) : base;
        const pshares=shares.map((s,si)=>({ name:s.name, amt:(isLast? +(s.amt-sBase[si]*(N-1)).toFixed(2) : sBase[si]), paid:false })).filter(s=>s.amt>0);
        const powed=pshares.reduce((a,s)=>a+s.amt,0);
        const pmonth=MONTHS_ABBR[(TODAY.monthIdx+startOff+k)%12];
        const pdate={day:D, month:pmonth};
        state.transactions.unshift({ t:`${desc} (${k+1}/${N})`, s:`${cat} · Crédito · ${c.bank} · parcela ${k+1}/${N}`, v:-pval, pos:false, icon:meta.icon, color:meta.color, cat, method:'Crédito', card:c.bank, shares:pshares, owed:powed, owedBy:(pshares[0]?pshares[0].name:''), date:pdate, inst:{i:k+1, n:N, group} });
        if(pmonth===TODAY.month) c.balance += pval; // só a parcela do mês corrente entra na fatura atual
      }
    }
    closeModal(); render();
  };
}

function openEditCardTxModal(gi){
  const x=state.transactions[gi]; if(!x) return;
  const oldVal=Math.abs(x.v);
  const oldMi = x.date? MONTHS_ABBR.indexOf(x.date.month) : TODAY.monthIdx;
  const oldDay = x.date? x.date.day : TODAY.day;
  const iso = `${state.calYear||2026}-${String(oldMi+1).padStart(2,'0')}-${String(oldDay).padStart(2,'0')}`;
  // cópia editável das divisões, preservando o que já foi recebido
  let work = txShares(x).map(s=>({name:s.name||'Alguém', amt:s.amt, received: shareRecv(s)}));
  openModal(`
    <div class="modal-head"><h3>Editar lançamento</h3><button class="modal-close" id="modalCloseBtn">${ic('x')}</button></div>
    <div class="form-row"><label>Descrição</label><input id="etDesc" value="${(x.t||'').replace(/"/g,'&quot;')}"></div>
    <div class="form-row"><label>Valor total (R$)</label><input id="etVal" type="number" step="0.01" value="${oldVal}"></div>
    <div class="form-row"><label>Data (define o mês da fatura)</label><input id="etDate" type="date" value="${iso}"></div>
    <div class="form-row"><label>Dividido com (quem te deve)</label>
      <div id="etShares"></div>
      <button class="btn ghost" id="etAddPerson" style="width:100%;padding:8px;font-size:12.5px;margin-top:2px">${ic('plus')} Adicionar pessoa</button>
      <div style="font-size:11px;color:var(--ink-faint);margin-top:6px">O que já foi recebido de cada pessoa é preservado. Remover alguém não devolve o que ela já pagou.</div>
    </div>
    <button class="btn primary" style="width:100%" id="etSave">Salvar</button>
  `);
  function syncFromInputs(){
    document.querySelectorAll('#etShares .etRow').forEach((r,i)=>{ if(work[i]){ work[i].name=r.querySelector('.etName').value; work[i].amt=parseFloat(r.querySelector('.etAmt').value)||0; } });
  }
  function renderShares(){
    const cont=document.getElementById('etShares');
    cont.innerHTML = work.length ? work.map((s,i)=>`
      <div class="etRow" style="display:flex;gap:8px;align-items:center;margin-bottom:${s.received>0?'2px':'8px'}">
        <input class="etName" value="${(s.name||'').replace(/"/g,'&quot;')}" placeholder="Nome" style="flex:1">
        <input class="etAmt" type="number" step="0.01" value="${s.amt||''}" placeholder="0,00" style="width:96px">
        <button class="icon-mini etRmPerson" data-i="${i}" title="Remover">${ic('x')}</button>
      </div>
      ${s.received>0?`<div style="font-size:11px;color:var(--green-ink);margin:0 2px 8px">${ic('check')} já recebeu ${BRL(s.received)}${s.received>=(s.amt||0)-0.001?' · quitado':''}</div>`:''}
    `).join('') : '<div style="font-size:12px;color:var(--ink-faint);padding:4px 2px">Ninguém — essa compra é 100% sua.</div>';
    cont.querySelectorAll('.etRmPerson').forEach(b=>b.onclick=()=>{ syncFromInputs(); work.splice(+b.dataset.i,1); renderShares(); });
  }
  renderShares();
  document.getElementById('etAddPerson').onclick=()=>{ syncFromInputs(); work.push({name:'', amt:0, received:0}); renderShares(); const names=document.querySelectorAll('#etShares .etName'); if(names.length) names[names.length-1].focus(); };
  document.getElementById('etSave').onclick=()=>{
    const nv=parseFloat(document.getElementById('etVal').value)||0; if(nv<=0){ document.getElementById('etVal').style.borderColor='var(--red)'; return; }
    syncFromInputs();
    const desc=document.getElementById('etDesc').value.trim()||x.t;
    const dv=document.getElementById('etDate').value||iso; const [,M,D]=dv.split('-').map(Number);
    const newMi=(M-1);
    const c=state.cards.find(cc=>cc.bank===x.card);
    if(c){
      const oldEff=(oldMi===TODAY.monthIdx)?oldVal:0;
      const newEff=(newMi===TODAY.monthIdx)?nv:0;
      c.balance=Math.max(0, c.balance - oldEff + newEff);
    }
    x.t=desc; x.v=-nv; x.date={day:D, month:MONTHS_ABBR[newMi]||(x.date&&x.date.month)||TODAY.month};
    // reconstrói as divisões preservando o recebido (limitado ao novo valor de cada parte)
    x.shares = work.filter(s=>(s.amt||0)>0).map(s=>{ const amt=Math.min(s.amt, nv); const received=Math.min(s.received||0, amt); return {name:(s.name||'').trim()||'Alguém', amt, received, paid: received>=amt-0.001}; });
    x.owed = x.shares.reduce((a,s)=>a+s.amt,0);
    x.owedBy = x.shares[0]?x.shares[0].name:'';
    closeModal(); render();
  };
}

function openReceiveModal(bank, name){
  // só marca a parte DAQUELE mês (parcelas de outros meses ficam pra quando você abrir aquele mês)
  const cm = state.cardMonth==null?TODAY.monthIdx:((state.cardMonth%12)+12)%12;
  const isCurrent = cm===TODAY.monthIdx;
  const inMonth = x => x.card===bank && !x.pos && (isCurrent ? (!x.date || MONTHS_ABBR.indexOf(x.date.month)===cm) : (x.date && MONTHS_ABBR.indexOf(x.date.month)===cm));
  const entries=[];
  (state.transactions||[]).forEach(x=>{ if(inMonth(x)){ txShares(x).forEach(s=>{ if((s.name||'Alguém')===name){ if(s.amt-shareRecv(s)>0.001) entries.push(s); } }); } });
  const owedRemaining=entries.reduce((a,s)=>a+(s.amt-shareRecv(s)),0);
  if(owedRemaining<=0) return;
  const banks=state.obBanks||[];
  openModal(`
    <div class="modal-head"><h3>Recebi de ${name}</h3><button class="modal-close" id="modalCloseBtn">${ic('x')}</button></div>
    <p style="font-size:13px;color:var(--ink-faint);margin:0 0 12px">Referente a <strong>${MONTH_NAMES[cm]}</strong>. ${name} te deve <strong>${BRL(owedRemaining)}</strong> neste mês.</p>
    <div class="form-row"><label>Quanto você recebeu? (R$)</label><input id="rcVal" type="number" step="0.01" value="${owedRemaining.toFixed(2)}"><div style="font-size:11.5px;color:var(--ink-faint);margin-top:5px">Já vem preenchido com o valor do mês — ajuste se recebeu a mais ou a menos.</div></div>
    <div class="form-row"><label>Entrou em qual conta?</label><div class="chip-select" id="rcAccount">
      ${banks.length ? banks.map((b,idx)=>`<span class="opt ${idx===0?'sel':''}" data-k="${b.key}">${b.name}</span>`).join('')+`<span class="opt" data-k="">Não somar</span>` : `<span class="opt sel" data-k="">Não somar</span>`}
    </div></div>
    <button class="btn primary" style="width:100%" id="rcSave">${ic('check')} Confirmar</button>
  `);
  let key=banks.length?banks[0].key:'';
  document.querySelectorAll('#rcAccount .opt').forEach(o=>o.onclick=()=>{ document.querySelectorAll('#rcAccount .opt').forEach(x=>x.classList.remove('sel')); o.classList.add('sel'); key=o.dataset.k; });
  document.getElementById('rcSave').onclick=()=>{
    let V=parseFloat(document.getElementById('rcVal').value); if(isNaN(V)||V<=0){ document.getElementById('rcVal').style.borderColor='var(--red)'; return; }
    const addToAccount=V;              // o que entrou de fato vai pra conta (mesmo se pagou a mais)
    let rem=V;
    entries.forEach(s=>{ if(rem<=0) return; const need=s.amt-shareRecv(s); const take=Math.min(rem, need); s.received=shareRecv(s)+take; s.paid=(s.received>=s.amt-0.001); rem-=take; });
    if(key){ const acc=banks.find(b=>b.key===key); if(acc){ acc.balance=(acc.balance||0)+addToAccount; recalcAccounts(); } }
    closeModal(); render();
  };
}

function parseQuickAdd(text){
  const raw = text.trim();
  const valMatch = raw.match(/(\d{1,3}(?:\.\d{3})*,\d{1,2}|\d+[.,]\d{1,2}|\d+)/);
  if(!valMatch) return null;
  let val = valMatch[1].replace(/\./g,'').replace(',', '.');
  val = parseFloat(val);
  if(isNaN(val) || val<=0) return null;

  let rest = raw.replace(valMatch[0],'').replace(/\breais?\b|\br\$\b/gi,'').trim();
  rest = rest.replace(/\s{2,}/g,' ');
  const lower = rest.toLowerCase();

  let found = QUICK_CATEGORIES.find(c=>c.words.some(w=>lower.includes(w)));
  const type = found ? found.type : 'out';
  const cat = found ? found.cat : 'Outros';
  const icon = found ? found.icon : 'wallet';
  const color = found ? found.color : 'red';
  const label = rest ? rest.charAt(0).toUpperCase()+rest.slice(1) : cat;

  return { val, label, cat, icon, color, type };
}

function confirmQuickAdd(input, preview, parsed){
  state.transactions.unshift({

    v: parsed.type==='in' ? parsed.val : -parsed.val,

  });
  if(parsed.cat!=='Outros' && parsed.type==='out'){
    const b = state.budgets.find(x=>x.name.toLowerCase().startsWith(parsed.cat.toLowerCase()) || (parsed.cat==='Lanche'&&x.name==='Lanches') || (parsed.cat==='Uber'&&x.name==='Ubers') || (parsed.cat==='Restaurante'&&x.name==='Restaurantes'));
    if(b) b.spent += parsed.val;
  }
  input.value=''; preview.classList.remove('show'); preview.innerHTML='';
  render();
}

function parseSpreadsheet(text){
  const items=[];
  text.split(/\r?\n/).forEach(line=>{
    line=line.trim(); if(!line) return;
    const parts = line.split(/[;\t,]/).map(p=>p.replace(/^"|"$/g,'').trim());
    if(parts.length<2) return;
    let valStr=null; const desc=[];
    parts.forEach(p=>{
      const num=p.replace(/R\$/gi,'').replace(/\s/g,'').replace(/\.(?=\d{3}(\D|$))/g,'').replace(',','.');
      if(/^-?\d+(\.\d+)?$/.test(num) && num!=='') valStr=num; else if(p) desc.push(p);
    });
    if(valStr===null) return;
    const val=Math.abs(parseFloat(valStr)); if(!val) return;
    const d=desc.join(' ')||'Lançamento';
    if(/^(descri|valor|data|categoria|hist)/i.test(d) && items.length===0) return; // pula cabeçalho
    items.push({desc:d, val});
  });
  return items;
}

        <div class="dt">${has? `${has} lançamentos lidos` : 'Escolher arquivo CSV'}</div>
        <div class="ds">${has? `Total detectado: ${BRL(total)}` : 'toque para selecionar'}</div>
      </label>
      <input type="file" id="obFile" accept=".csv,.txt,.tsv" style="display:none">
      <button class="ob-import-btn" id="obSample" style="margin-top:12px">${ic('sheet')} Não tenho arquivo — usar exemplo</button>
      ${has?`<div class="card card-pad" style="margin-top:16px;max-height:210px;overflow:auto">
        ${ob.importedTx.slice(0,8).map(i=>`<div class="tx-row"><div class="tx-mid"><div class="t">${i.desc}</div></div><div class="tx-val neg num">${BRL(i.val)}</div></div>`).join('')}
        ${ob.importedTx.length>8?`<div class="empty" style="padding:10px">+ ${ob.importedTx.length-8} lançamentos</div>`:''}
      </div>`:''}
    </div>
    <div class="ob-foot">
      <button class="btn back" id="obBack">${ic('chevL')}</button>
      <button class="btn primary" id="obImportNext" ${has?'':'style="opacity:.45;pointer-events:none"'}>Revisar dados ${ic('chevR')}</button>
    </div>
  </div>`;
}
function wireObImport(){
  document.getElementById('obFile').onchange=(e)=>{
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{ ob.importedTx = parseSpreadsheet(reader.result); if(!ob.importedTx.length){ ob.importedTx = SAMPLE_SHEET.slice(); } renderOb(); };
    reader.readAsText(file);
  };
  document.getElementById('obSample').onclick=()=>{ ob.importedTx = SAMPLE_SHEET.slice(); renderOb(); };
  document.getElementById('obBack').onclick=()=>{ ob.step='method'; renderOb(); };
  const next = document.getElementById('obImportNext');
  if(next) next.onclick=()=>{
    const total = ob.importedTx.reduce((a,i)=>a+i.val,0);
    if(total>0 && !Object.keys(ob.cards).length){
      ob.cards['importado'] = {name:'Fatura importada', color:'#7C4DFF', invoice:total.toFixed(2), due:'10', importedItems:ob.importedTx.slice()};
      ob.importedTx = []; // movido para o cartão, evita contagem dupla
    }
    ob.fromImport = true; ob.step = 1; renderOb();
  };
}
